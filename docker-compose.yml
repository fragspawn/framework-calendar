services:
  node-app:
    image: node:20-alpine
    container_name: calendar-app-dev
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    ports:
      - "5173:5173"
      - "3000:3000"
    volumes:
      - ./app:/app:z
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development
      - UID=${UID:-1000}
      - GID=${GID:-1000}
    stdin_open: true
    tty: true

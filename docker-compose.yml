services:
  node-app:
    image: node:20-alpine
    container_name: calendar-app-dev
    working_dir: /app
    ports:
      - "5173:5173"
      - "3000:3000"
    volumes:
      - ./app:/app:z
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
